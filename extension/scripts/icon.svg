    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8ff7"/>
      <stop offset="1" stop-color="#2554c7"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#bg)"/>
  <!-- Three browser tabs dropping into a tray. -->
  <path d="M34 41c4 0 6-2 6-6v-4a5 5 0 0 1 5-5h22a5 5 0 0 1 5 5v4c0 4 2 6 6 6z" fill="#fff" opacity=".5"/>
  <path d="M40 56c4 0 6-2 6-6v-4a5 5 0 0 1 5-5h22a5 5 0 0 1 5 5v4c0 4 2 6 6 6z" fill="#fff" opacity=".75"/>
  <path d="M46 71c4 0 6-2 6-6v-4a5 5 0 0 1 5-5h22a5 5 0 0 1 5 5v4c0 4 2 6 6 6z" fill="#fff"/>
  <path d="M32 66v18a10 10 0 0 0 10 10h44a10 10 0 0 0 10-10V66" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
