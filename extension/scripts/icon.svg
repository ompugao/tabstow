<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Artwork stays inside 16..112 so the 128px store icon has the padding the
       Chrome Web Store asks for; make-icons.mjs crops it for toolbar sizes. -->
